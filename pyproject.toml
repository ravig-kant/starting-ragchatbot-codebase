[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "black>=26.10.0",
    "flake8>=7.4.1",
    "isort>=9.0.2",
    "pytest>=9.1.1",
]

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
/(
    backend/chroma_db
)/
'''

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["backend"]
skip_glob = ["backend/chroma_db/*"]
